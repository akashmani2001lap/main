//Task 6 - Callback Hell to Promise Chain

function getUser() {
  return new Promise((resolve) => {
    setTimeout(() => {
      resolve("User Fetched");
    }, 1000);
  });
}

function getOrders() {
  return new Promise((resolve) => {
    setTimeout(() => {
      resolve("Orders Fetched");
    }, 1000);
  });
}

function getPayments() {
  return new Promise((resolve) => {
    setTimeout(() => {
      resolve("Payment Fetched");
    }, 1000);
  });
}

getUser()
  .then((user) => {
    console.log(user);
    return getOrders();
  })
  .then((orders) => {
    console.log(orders);
    return getPayments();
  })
  .then((payment) => {
    console.log(payment);
    console.log("Completed");
  })
  .catch((error) => {
    console.error(error);
  });
